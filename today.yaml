import hashlib
import json
from pathlib import Path


def calculate_checksum(file_path):
    sha256 = hashlib.sha256()

    with open(file_path, "rb") as file:
        while chunk := file.read(8192):
            sha256.update(chunk)

    return sha256.hexdigest()


def find_ttl_files():
    return list(Path("ontology").rglob("*.ttl"))


def generate_manifest():

    ttl_files = find_ttl_files()

    artifacts = []

    for file_path in ttl_files:

        artifacts.append(
            {
                "path": file_path.as_posix(),
                "size": file_path.stat().st_size,
                "sha256": calculate_checksum(file_path),
            }
        )

    manifest = {
        "version": "1.0",
        "files": artifacts,
    }

    # Create deployment directory if it doesn't exist
    deployment_dir = Path("deployment")
    deployment_dir.mkdir(parents=True, exist_ok=True)

    # Create manifest.json inside deployment folder
    manifest_path = deployment_dir / "manifest.json"

    with open(
        manifest_path,
        "w",
        encoding="utf-8",
    ) as file:

        json.dump(
            manifest,
            file,
            indent=4,
        )

    print(f"{manifest_path} generated successfully")


if __name__ == "__main__":
    generate_manifest()
