import os

import requests
from dotenv import load_dotenv


load_dotenv()


def create_pull_request():

    base_url = os.environ["BITBUCKET_URL"]

    project = os.environ[
        "BITBUCKET_PROJECT_KEY"
    ]

    repository = os.environ[
        "BITBUCKET_REPOSITORY"
    ]

    username = os.environ[
        "BITBUCKET_USERNAME"
    ]

    password = os.environ[
        "BITBUCKET_PASSWORD"
    ]

    source_branch = os.environ[
        "BRANCH_NAME"
    ]

    target_branch = os.environ.get(
        "TARGET_BRANCH",
        "develop",
    )

    url = (
        f"{base_url}/rest/api/latest/"
        f"projects/{project}/repos/"
        f"{repository}/pull-requests"
    )

    data = {
        "title": (
            f"Ontology update - "
            f"{source_branch}"
        ),
        "description": (
            "Automatically created "
            "ontology pull request."
        ),
        "fromRef": {
            "id": (
                f"refs/heads/"
                f"{source_branch}"
            )
        },
        "toRef": {
            "id": (
                f"refs/heads/"
                f"{target_branch}"
            )
        },
    }

    response = requests.post(
        url,
        json=data,
        auth=(username, password),
        timeout=30,
    )

    response.raise_for_status()

    result = response.json()

    print(
        "PR created:",
        result["id"],
    )

    print(
        "PR URL:",
        result["links"]["self"][0]["href"],
    )

    return result


if __name__ == "__main__":
    create_pull_request()
